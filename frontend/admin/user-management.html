<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management – InsurAI Admin</title>
  <link rel="stylesheet" href="../assets/css/design.css">
  <script src="../assets/js/lucide.min.js"></script>
</head>
<body>
<div id="app-layout">
  <div class="page-header-row">
    <div><h1>User</h1><p>Manage platform users, roles, and access control</p></div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-outline"><i data-lucide="download"></i> Export</button>
      <button class="btn btn-primary"><i data-lucide="user-plus"></i> Invite User</button>
    </div>
  </div>

  <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px;">
    <div class="stat-card blue"><div class="stat-icon blue"><i data-lucide="users"></i></div><div class="stat-label">Total Users</div><div class="stat-value" id="statTotalUsers" style="font-size:22px;">...</div></div>
    <div class="stat-card teal"><div class="stat-icon teal"><i data-lucide="shield"></i></div><div class="stat-label">Admins</div><div class="stat-value" id="statAdminCount" style="font-size:22px;">...</div></div>
    <div class="stat-card green"><div class="stat-icon green"><i data-lucide="user-check"></i></div><div class="stat-label">Staff</div><div class="stat-value" id="statStaffCount" style="font-size:22px;">...</div></div>
    <div class="stat-card indigo"><div class="stat-icon indigo"><i data-lucide="user"></i></div><div class="stat-label">Employees</div><div class="stat-value" id="statEmployeeCount" style="font-size:22px;">...</div></div>
  </div>

  <div class="card">
    <div class="card-title-row">
      <span class="card-title"><i data-lucide="users" style="width:16px;height:16px;color:var(--blue-light);"></i> All Users</span>
    </div>
    <div class="filters-bar" style="margin-bottom:14px;">
      <div class="filter-search"><i data-lucide="search"></i><input type="text" id="searchFilter" placeholder="Search by name or email…" onkeyup="loadUsers()"></div>
      <select class="filter-select" id="roleFilter" onchange="loadUsers()"><option value="">All Roles</option><option value="ADMIN">Admin</option><option value="STAFF">Staff</option><option value="EMPLOYEE">Employee</option></select>
    </div>
    <div class="table-wrapper">
      <table>
        <thead><tr><th>User</th><th>Email</th><th>Department</th><th>Role</th><th>Last Active</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="usersTableBody">
          <tr><td colspan="7" style="text-align:center;">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="pagination">
      <span id="userPaginationInfo">Showing 0–0 of 0 users</span>
      <div class="page-btns">
        <button class="page-btn active">1</button>
        <button class="page-btn"><i data-lucide="chevron-right" style="width:14px;height:14px;"></i></button>
      </div>
    </div>
  </div>
</div>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    initLayout('admin', window.location.pathname);
    requireAuth(['ADMIN']);
    
    await loadUsers();
  });

  let allUsers = [];
  async function loadUsers() {
    try {
        const users = await apiRequest('/users', { method: 'GET' });
        allUsers = users || [];
        
        const role = document.getElementById('roleFilter').value;
        const search = document.getElementById('searchFilter').value.toLowerCase();
        
        let filtered = [...allUsers];
        if (role) filtered = filtered.filter(u => u.role === role);
        if (search) filtered = filtered.filter(u => 
            (u.username && u.username.toLowerCase().includes(search)) || 
            (u.email && u.email.toLowerCase().includes(search))
        );
        const tbody = document.getElementById('usersTableBody');
        tbody.innerHTML = '';
        
        let total = 0, admins = 0, staff = 0, employees = 0;

        if(!users || users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No users found.</td></tr>';
            document.getElementById('userPaginationInfo').textContent = 'Showing 0 users';
        } else {
            filtered.forEach(u => {
                total++;
                if(u.role === 'ADMIN') admins++;
                else if(u.role === 'STAFF') staff++;
                else employees++;

                const tr = document.createElement('tr');
                
                let roleBadgeClass = 'badge-blue';
                if(u.role === 'ADMIN') roleBadgeClass = 'badge-purple';
                if(u.role === 'STAFF') roleBadgeClass = 'badge-teal';
                
                const initials = (u.username || 'U').substring(0, 2).toUpperCase();
                const colors = ['#2563EB', '#0D9488', '#4F46E5', '#D97706', '#9333EA'];
                const bgColor = colors[u.id % colors.length];

                tr.innerHTML = `
                    <td>
                        <div style="display:flex;align-items:center;gap:8px;">
                            <div style="width:32px;height:32px;border-radius:50%;background:${bgColor};display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:700;">${initials}</div>
                            <strong>${u.username}</strong>
                        </div>
                    </td>
                    <td style="color:var(--gray-500);">${u.email || '-'}</td>
                    <td>${u.department || '-'}</td>
                    <td><span class="badge ${roleBadgeClass}">${u.role}</span></td>
                    <td>${u.lastActive || 'Today'}</td>
                    <td><span class="badge badge-green badge-dot">Active</span></td>
                    <td>
                        <button class="btn btn-ghost btn-sm" onclick="editUser(${u.id})"><i data-lucide="edit"></i></button>
                        <button class="btn btn-ghost btn-sm" onclick="lockUser(${u.id})"><i data-lucide="lock" style="color:var(--red);"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('userPaginationInfo').textContent = `Showing 1–${filtered.length} of ${filtered.length} users`;
        }

        // Update stats
        document.getElementById('statTotalUsers').textContent = total;
        document.getElementById('statAdminCount').textContent = admins;
        document.getElementById('statStaffCount').textContent = staff;
        document.getElementById('statEmployeeCount').textContent = employees;
        
        if(window.lucide) lucide.createIcons();
        
    } catch (err) {
        console.error('Failed to load users', err);
        document.getElementById('usersTableBody').innerHTML = '<tr><td colspan="7" style="text-align:center;color:red;">Failed to load users</td></tr>';
    }
  }

  function editUser(id) { 
      const user = allUsers.find(u => u.id === id);
      if(!user) return;
      document.getElementById('editUserId').value = user.id;
      document.getElementById('editUsername').value = user.username || '';
      document.getElementById('editEmail').value = user.email || '';
      document.getElementById('editDept').value = user.department || '';
      document.getElementById('editUserRole').value = user.role || 'EMPLOYEE';
      document.getElementById('editUserModal').style.display = 'flex';
  }

  async function submitEditUser() {
      const id = document.getElementById('editUserId').value;
      const payload = {
          username: document.getElementById('editUsername').value,
          email: document.getElementById('editEmail').value,
          department: document.getElementById('editDept').value,
          role: document.getElementById('editUserRole').value
      };
      try {
          await apiRequest('/users/' + id, { method: 'PUT', body: JSON.stringify(payload) });
          showToast('User updated successfully', 'success');
          document.getElementById('editUserModal').style.display = 'none';
          loadUsers();
      } catch(e) {
          showToast('Failed to update: ' + e.message, 'error');
      }
  }

  async function lockUser(id) { 
      if(!confirm('Are you sure you want to delete this user?')) return;
      try {
          await apiRequest('/users/' + id, { method: 'DELETE' });
          showToast('User deleted', 'success');
          loadUsers();
      } catch(e) {
          showToast('Could not delete user: ' + e.message, 'error');
      }
  }
</script>

<div id="editUserModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;">
    <div class="card" style="width:400px;background:white;">
        <h3 style="margin-top:0;">Edit User</h3>
        <input type="hidden" id="editUserId">
        <label class="form-label">Username</label><input type="text" id="editUsername" class="form-control" style="margin-bottom:10px;">
        <label class="form-label">Email</label><input type="email" id="editEmail" class="form-control" style="margin-bottom:10px;">
        <label class="form-label">Department</label><input type="text" id="editDept" class="form-control" style="margin-bottom:10px;">
        <label class="form-label">Role</label>
        <select class="form-control" id="editUserRole" style="margin-bottom:16px;">
            <option value="ADMIN">ADMIN</option>
            <option value="STAFF">STAFF</option>
            <option value="EMPLOYEE">EMPLOYEE</option>
        </select>
        <div style="display:flex;gap:10px;justify-content:flex-end;">
            <button class="btn btn-outline" onclick="document.getElementById('editUserModal').style.display='none'">Cancel</button>
            <button class="btn btn-primary" onclick="submitEditUser()">Save</button>
        </div>
    </div>
</div>

</body></html>
